services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"  # the database is for the notebooks on this machine, never for the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]  # over TCP: the temporary server of the first start only listens on its socket
      interval: 5s
      timeout: 5s
      retries: 10

  loader:
    build: ./loader
    volumes:
      - ./collections:/collections:ro
      - ./data:/data:ro
      - styles:/styles
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/postgres
    depends_on:
      postgis:
        condition: service_healthy

  pygeoapi:
    build: ./pygeoapi
    environment:
      PYGEOAPI_SERVER_URL: ${PYGEOAPI_SERVER_URL:-http://localhost:5000}
    ports:
      - "5000:80"
    volumes:
      - styles:/styles:ro
    depends_on:
      postgis:
        condition: service_healthy
      loader:
        condition: service_completed_successfully

volumes:
  styles:
